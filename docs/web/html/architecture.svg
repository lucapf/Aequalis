<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 600" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<title id="t">Aequalis architecture</title>
<desc id="d">One Rust core library below, three kinds of front end above (command line, TUI, widget or app) on macOS, Linux, Windows and Android, joined by three bindings: the Rust crate, the JSON command line, and the C interface with JNI.</desc>
<style>
text{fill:#1F5B45;font-size:14px}
.h{font-weight:700;font-size:15px}.m{fill:#6b8a7c;font-size:12px}.s{font-size:12px;font-weight:600}
.cell{fill:#fff;stroke:#b9d3c4;stroke-width:1.5}
.na{fill:none;stroke:#b9d3c4;stroke-width:1.5;stroke-dasharray:4 4}
.soon{fill:#fff;stroke:#6b8a7c;stroke-width:1.5;stroke-dasharray:6 4}
.crate{fill:#1F5B45}.json{fill:#BF7510}.ffi{fill:#4a6fa5}
.bind{fill:#fff;stroke-width:2}
.bg{fill:#f4f9f5}.bc{stroke:#1F5B45}.bj{stroke:#BF7510}.bf{stroke:#4a6fa5}.ar{stroke:#6b8a7c;stroke-width:2;fill:none}.af{fill:#6b8a7c}
.core{fill:#1F5B45}.chip{fill:none;stroke:#F7F0E6;stroke-opacity:.55;stroke-width:1.2}
.oc{fill:#F7F0E6}
@media (prefers-color-scheme:dark){
text{fill:#dcebe2;font-size:14px}.m{fill:#8fae9f;font-size:12px}
.cell{fill:#1d2d25;stroke:#33503f;stroke-width:1.5}
.na{fill:none;stroke:#33503f;stroke-width:1.5;stroke-dasharray:4 4}
.soon{fill:#1d2d25;stroke:#8fae9f;stroke-width:1.5;stroke-dasharray:6 4}
.crate{fill:#6fcf9f}.json{fill:#F2B84B}.ffi{fill:#8fb4ee}
.bind{fill:#1d2d25;stroke-width:2}
.bg{fill:#14201a}.bc{stroke:#6fcf9f}.bj{stroke:#F2B84B}.bf{stroke:#8fb4ee}.ar{stroke:#8fae9f;stroke-width:2;fill:none}.af{fill:#8fae9f}
.core{fill:#2b6f55}.chip{fill:none;stroke:#F7F0E6;stroke-opacity:.55;stroke-width:1.2}
.oc{fill:#F7F0E6}
}
</style>
<rect class="bg" width="950" height="600" rx="14"/>

<!-- column heads -->
