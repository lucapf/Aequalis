[package]
name = "tally"
version = "0.1.0"
edition = "2021"
description = "Units, calculator, dates, time zones and distances, answered as you type: a tiny dependency-free CLI, TUI and Omarchy widget"
authors = ["Luca Palanca Falsini"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/lucapf/tally"
homepage = "https://github.com/lucapf/tally"
keywords = ["calculator", "units", "converter", "timezone", "cli"]
categories = ["command-line-utilities", "science", "date-and-time"]

[dependencies]

[features]
default = ["tui"]
# Interactive mode (`tally` with no arguments in a terminal). Still no dependencies.
tui = []
# The C interface for apps that embed tally (the iPhone app: `src/ffi.rs`, `include/tally.h`).
ffi = []

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
