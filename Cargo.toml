[package]
name = "aequalis"
version = "0.1.0"
edition = "2021"
description = "Units, calculator, dates, time zones and distances, answered as you type: a tiny dependency-free CLI, TUI and Omarchy widget"
authors = ["Luca Palanca Falsini"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/lucapf/aequalis"
homepage = "https://github.com/lucapf/aequalis"
keywords = ["calculator", "units", "converter", "timezone", "cli"]
categories = ["command-line-utilities", "science", "date-and-time"]

[dependencies]

[features]
default = ["tui"]
# Interactive mode (`aequalis` with no arguments in a terminal). Still no dependencies.
tui = []
# The C interface for apps that embed aequalis (the Android app: `src/ffi.rs`, `include/aequalis.h`).
ffi = []

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# The fuzzer's build (`fuzz/fuzz.py build`): fast, and every integer overflow and debug assertion
# a panic, where the release build wraps silently; aborts on a panic, as the app does.
[profile.fuzz]
inherits = "release"
opt-level = 3
lto = false
codegen-units = 16
overflow-checks = true
debug-assertions = true
debug = "line-tables-only"
strip = false
