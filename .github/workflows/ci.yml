name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Build
        run: cargo build --release
      - name: Build without the interactive mode
        run: cargo build --release --no-default-features
      - name: Test
        run: cargo test
      - name: Test the C interface (the Android app's)
        run: cargo test --features ffi --lib ffi

  # Windows (MSVC). Windows has no IANA zone database of its own: the tests get one from the
  # `tzdata` package on PyPI (the same TZif files as /usr/share/zoneinfo), through `TZDIR`.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Zone database
        run: |
          python -m pip install --quiet tzdata
          echo "TZDIR=$(python -c 'import os, tzdata; print(os.path.join(os.path.dirname(tzdata.__file__), "zoneinfo"))')" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release
      - name: Build without the interactive mode
        run: cargo build --release --no-default-features
      - name: Smoke test
        run: |
          target/release/aequalis 10 km mi
          target/release/aequalis --json 1+1
          TZ=Europe/Rome target/release/aequalis 10:00AM Paris to New York
          # The system's zones (the registry), as on a user's machine: no TZDIR, no TZ.
          env -u TZDIR -u TZ target/release/aequalis now
          env -u TZDIR -u TZ target/release/aequalis 2025-07-15T12:00 Rome to Cairo
      - name: Test
        # The failures are also written as annotations of the run (the page of the run shows them
        # without opening the log).
        run: |
          set +e
          cargo test --no-fail-fast 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          if [ "$status" != 0 ]; then
            names=$(grep -E '^test .* FAILED|^error' test.log | head -30 | awk 'BEGIN{ORS="%0A"}{print}')
            echo "::error title=Failed tests::${names}"
            why=$(grep -A4 -E '^---- .* stdout ----' test.log | head -c 3500 | awk 'BEGIN{ORS="%0A"}{print}')
            [ -n "$why" ] && echo "::error title=Why::${why}"
          fi
          exit $status
      - name: Test the C interface
        run: cargo test --features ffi --lib ffi
