name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Build
        run: cargo build --release
      - name: Build without the interactive mode
        # In a folder of its own: it must not replace the exe the installer ships.
        run: cargo build --release --no-default-features --target-dir target/no-tui
      # A folder of their own for aequalis's files, offline: a test that sets none (it runs in the
      # runner's home) never starts a background sync of the real online data.
      - name: Keep the tests offline
        run: |
          mkdir -p "$RUNNER_TEMP/aequalis-config/aequalis"
          echo '{"offline": true}' > "$RUNNER_TEMP/aequalis-config/aequalis/settings.json"
          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/aequalis-config" >> "$GITHUB_ENV"
      - name: Test
        run: cargo test
      - name: Test the C interface (the Android app's)
        run: cargo test --features ffi --lib ffi

  # macOS on Apple Silicon, as the release builds it: the BSD tools (`script`, `sed`) are not Linux's.
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      # A folder of their own for aequalis's files, offline: a test that sets none (it runs in the
      # runner's home) never starts a background sync of the real online data.
      - name: Keep the tests offline
        run: |
          mkdir -p "$RUNNER_TEMP/aequalis-config/aequalis"
          echo '{"offline": true}' > "$RUNNER_TEMP/aequalis-config/aequalis/settings.json"
          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/aequalis-config" >> "$GITHUB_ENV"
      - name: Test
        run: cargo test --no-fail-fast
      - name: Test the release build
        if: always()
        run: cargo test --release --no-fail-fast
      - name: Build the app
        # Aequalis.app, as the release builds it: the Swift code is compiled and run here, not on a Mac anyone debugs on.
        if: always()
        run: apps/macos/build.sh "$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"

  # The test suite's line coverage (`scripts/coverage.py`), on each commit on master: the table in the
  # run's summary, the figures as JSON in the run's artifacts.
  coverage:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component llvm-tools && rustup default stable
      # A folder of their own for aequalis's files, offline: a test that sets none (it runs in the
      # runner's home) never starts a background sync of the real online data.
      - name: Keep the tests offline
        run: |
          mkdir -p "$RUNNER_TEMP/aequalis-config/aequalis"
          echo '{"offline": true}' > "$RUNNER_TEMP/aequalis-config/aequalis/settings.json"
          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/aequalis-config" >> "$GITHUB_ENV"
      - name: Coverage
        # `shell: bash` for pipefail: a failing script fails the step, not `tee`'s success.
        shell: bash
        run: python3 scripts/coverage.py --json coverage.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.json

  # Clippy wherever the code compiles. A Linux build compiles neither the Windows code nor the
  # Android bridge (`src/jni.rs`): their warnings and errors went unseen. Checking another target
  # needs only its standard library (no linker, no NDK), so one Linux job does them all. Any
  # warning fails it.
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustup target add x86_64-pc-windows-msvc aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - name: Linux
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy --workspace --all-targets --no-default-features -- -D warnings
          cargo clippy --workspace --all-targets --features ffi -- -D warnings
      - name: Windows
        # The command line and the tray app (apps/windows), as the windows job builds them.
        run: cargo clippy --target x86_64-pc-windows-msvc --workspace --all-targets -- -D warnings
      - name: Android
        # The library as scripts/build-android.sh builds it, for each of the app's ABIs.
        run: |
          for target in aarch64-linux-android armv7-linux-androideabi x86_64-linux-android; do
            cargo clippy --target "$target" --lib --no-default-features --features ffi -- -D warnings
          done

  # Windows (MSVC). Windows has no IANA zone database of its own: the tests get one from the
  # `tzdata` package on PyPI (the same TZif files as /usr/share/zoneinfo), through `TZDIR`.
  windows:
    runs-on: windows-latest
    # To publish the build of a branch as a pre-release (below).
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Version
        # Every run has a version of its own, going up: the next release's number, `-dev.` and the
        # run's number (0.2.11-dev.57). It is the program's version (`aequalis --version`, About),
        # the installer's name and the file information; the release workflow numbers the releases.
        run: |
          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          base=${last#v}
          IFS=. read -r major minor patch <<< "${base:-0.1.0}"
          next="$major.$minor.$((patch + 1))"
          echo "VERSION=$next-dev.${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "VERSION_INFO=$next.${{ github.run_number }}" >> "$GITHUB_ENV"
          sed -i -E "s/^version = \".*\"/version = \"$next-dev.${{ github.run_number }}\"/" Cargo.toml apps/windows/Cargo.toml
      - name: Zone database
        run: |
          python -m pip install --quiet tzdata
          echo "TZDIR=$(python -c 'import os, tzdata; print(os.path.join(os.path.dirname(tzdata.__file__), "zoneinfo"))')" >> "$GITHUB_ENV"
      - name: Build
        # The command line and the tray app (apps/windows).
        run: cargo build --release --workspace
      - name: Build without the interactive mode
        # In a folder of its own: it must not replace the exe the installer ships.
        run: cargo build --release --no-default-features --target-dir target/no-tui
      - name: Smoke test
        run: |
          test "$(target/release/aequalis --version)" = "aequalis $VERSION"
          target/release/aequalis 10 km mi
          target/release/aequalis --json 1+1
          TZ=Europe/Rome target/release/aequalis 10:00AM Paris to New York
          # The system's zones (the registry), as on a user's machine: no TZDIR, no TZ.
          env -u TZDIR -u TZ target/release/aequalis now
          env -u TZDIR -u TZ target/release/aequalis 2025-07-15T12:00 Rome to Cairo
      - name: Test
        # The failures are also written as annotations of the run (the page of the run shows them
        # without opening the log).
        run: |
          set +e
          cargo test --workspace --no-fail-fast 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          if [ "$status" != 0 ]; then
            names=$(grep -E '^test .* FAILED|^error' test.log | head -30 | awk 'BEGIN{ORS="%0A"}{print}')
            echo "::error title=Failed tests::${names}"
            why=$(grep -A4 -E '^---- .* stdout ----' test.log | head -c 3500 | awk 'BEGIN{ORS="%0A"}{print}')
            [ -n "$why" ] && echo "::error title=Why::${why}"
          fi
          exit $status
      - name: Test the C interface
        run: cargo test --features ffi --lib ffi
      # The installer (Inno Setup), checked as a user meets it: installed, run, uninstalled.
      - name: Installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          & $iscc /Q "/DVersion=$env:VERSION" "/DVersionInfo=$env:VERSION_INFO" installer/windows/aequalis.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & installer/windows/test-install.ps1 -Setup "dist/aequalis-$env:VERSION-x86_64-windows-setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*-setup.exe
      - name: Publish the build
        # A branch (not master, which has its own releases) keeps its latest build as a pre-release
        # `dev-<branch>`: the installer, to download without signing in. The tag does not start with
        # `v<number>`, so it never counts as a release version.
        if: github.event_name == 'push' && github.ref_name != 'master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="dev-${GITHUB_REF_NAME//\//-}"
          if gh release view "$tag" >/dev/null 2>&1; then gh release delete "$tag" --yes --cleanup-tag; fi
          gh release create "$tag" dist/*-setup.exe --prerelease --target "$GITHUB_SHA" \
            --title "$VERSION (branch $GITHUB_REF_NAME)" \
            --notes "The latest build of the branch \`$GITHUB_REF_NAME\`, version $VERSION (commit ${GITHUB_SHA::7}). Not a release: it is replaced by the next push to the branch."

  # The interactive mode in a real Windows console: a pseudo-console (ConPTY) gets the keys of a
  # terminal and its screen is read back (scripts/windows-tui-smoke.py).
  windows-tui:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Build
        run: cargo build --release
      - name: Interactive mode
        run: |
          python -m pip install --quiet pywinpty
          # No network, so nothing downloads during the check.
          target/release/aequalis --set offline=true
          python scripts/windows-tui-smoke.py target/release/aequalis.exe
