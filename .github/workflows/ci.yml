name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Build
        run: cargo build --release
      - name: Build without the interactive mode
        run: cargo build --release --no-default-features
      - name: Test
        run: cargo test

  # The macOS menu bar app (macos/): built, and its tests run against the CLI built here.
  macos-app:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: CLI
        run: cargo build --release
      # Compiler errors and failed tests become annotations (shown on the run's page, also without
      # signing in to GitHub).
      - name: App
        working-directory: macos
        run: |
          set -o pipefail
          annotate() { sed -nE 's#^(/[^:]+):([0-9]+):([0-9]+): error: (.*)#::error file=\1,line=\2,col=\3::\4#p' "$1"; grep -E "error: -\[|XCTAssert|failed \(" "$1" | sed 's/^/::error::/' | head -20; }
          if ! swift build 2>&1 | tee build.log; then annotate build.log; exit 1; fi
          if ! TALLY_BIN="$GITHUB_WORKSPACE/target/release/tally" swift test 2>&1 | tee test.log; then annotate test.log; exit 1; fi
      - name: Bundle
        run: |
          macos/build-app.sh 0.0.0 target/release/tally dist
          ls -la dist dist/Tally.app/Contents/MacOS dist/Tally.app/Contents/Resources

  # The Raycast extension (raycast/): lint and build.
  raycast:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: raycast
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # `ray lint` also checks the author on raycast.com: ESLint and Prettier here, and the types.
      - run: npx eslint src
      - run: npx prettier --check src
      - run: npx tsc --noEmit
      - run: npm run build

