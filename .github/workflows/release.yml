# Every push to master is a release: the version goes up, tally is built for Linux (x86_64 and
# aarch64) and macOS (Apple Silicon, plus the menu bar app Tally.app), and a GitHub release
# `v<version>` gets the archives.
#
# The version: the latest `v*` tag (none yet: Cargo.toml's) with the patch number up by one. A
# commit message starting with `minor` or `major` (any case: `minor: add …`, `Major …`) raises that
# number instead; with several commits in the push, the largest bump wins. Cargo.toml is not
# changed in the repository: the tags are the version, written into Cargo.toml for the build only.
name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

# One release at a time, in push order: each version is computed from the previous one's tag.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: v
        run: |
          # Already released (a re-run): the same version.
          done=$(git tag --points-at HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          if [ -n "$done" ]; then
            echo "version=${done#v}" >> "$GITHUB_OUTPUT"
            echo "HEAD is already $done"
            exit 0
          fi
          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          if [ -n "$last" ]; then
            base=${last#v}
            range="$last..HEAD"
          else
            base=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
            range=HEAD
          fi
          subjects=$(git log --format=%s "$range")
          bump=patch
          if printf '%s\n' "$subjects" | grep -qiE '^major([^[:alnum:]]|$)'; then
            bump=major
          elif printf '%s\n' "$subjects" | grep -qiE '^minor([^[:alnum:]]|$)'; then
            bump=minor
          fi
          IFS=. read -r major minor patch <<< "$base"
          case $bump in
            major) version="$((major + 1)).0.0" ;;
            minor) version="$major.$((minor + 1)).0" ;;
            patch) version="$major.$minor.$((patch + 1))" ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "${last:-Cargo.toml $base} → v$version ($bump)"

  # Ubuntu 22.04: the binaries need glibc 2.35 or newer, so they also run on newer Ubuntu, Debian,
  # Fedora and Arch Linux / Omarchy.
  linux:
    needs: version
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install stable --profile minimal && rustup default stable
      - name: Version
        run: |
          sed -i -E "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          sed -i -E "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" omarchy-widget/manifest.json
      - name: Test
        run: cargo test --release
      - name: Build
        run: |
          cargo build --release
          test "$(target/release/tally --version)" = "tally $VERSION"
          target/release/tally 10 km mi
      - name: Package
        run: |
          name=tally-$VERSION-${{ matrix.arch }}-linux
          mkdir -p "dist/$name"
          cp target/release/tally LICENSE README.md docs/Accepted_Syntax.md "dist/$name/"
          cp -r omarchy-widget "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*.tar.gz*

  # macOS on Apple Silicon (macOS 11 or newer).
  macos:
    needs: version
    runs-on: macos-14
    env:
      VERSION: ${{ needs.version.outputs.version }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Version
        run: sed -i '' -E "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
      - name: Test
        # Not yet verified on macOS: reported, not blocking the release.
        continue-on-error: true
        run: cargo test --release
      - name: Build
        run: |
          cargo build --release
          file target/release/tally
          test "$(target/release/tally --version)" = "tally $VERSION"
          target/release/tally 10 km mi
      - name: Package
        run: |
          name=tally-$VERSION-aarch64-macos
          mkdir -p "dist/$name"
          cp target/release/tally LICENSE README.md docs/Accepted_Syntax.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
      # The menu bar app, with this CLI inside: Tally-<version>-macos.zip.
      - name: Menu bar app
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.0"
        run: |
          (cd macos && TALLY_BIN="$GITHUB_WORKSPACE/target/release/tally" swift test)
          macos/build-app.sh "$VERSION" target/release/tally dist
          (cd dist && shasum -a 256 "Tally-$VERSION-macos.zip" > "Tally-$VERSION-macos.zip.sha256")
          test "$(dist/Tally.app/Contents/Resources/tally --version)" = "tally $VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/*.tar.gz*
            dist/*.zip*

  # The release `v<version>` on the pushed commit (the tag is created with it), with every archive.
  release:
    needs: [version, linux, macos]
    runs-on: ubuntu-latest
    env:
      TAG: v${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Tally $TAG" --generate-notes
          fi

  # The Omarchy plugin repository (github.com/lucapf/omarchy-tally, for `omarchy plugin add`): the
  # widget with the release's version, its README and the license, at the root as Omarchy wants
  # them. It needs the secret OMARCHY_PLUGIN_DEPLOY_KEY: the private half of a deploy key with write
  # access to that repository. Without it this job only says so.
  omarchy-plugin:
    needs: [version, release]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      DEPLOY_KEY: ${{ secrets.OMARCHY_PLUGIN_DEPLOY_KEY }}
    steps:
      - id: key
        run: |
          if [ -n "$DEPLOY_KEY" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::OMARCHY_PLUGIN_DEPLOY_KEY is not set: lucapf/omarchy-tally is not updated"
          fi
      - uses: actions/checkout@v5
        if: steps.key.outputs.ok == 'true'
      - name: Publish
        if: steps.key.outputs.ok == 'true'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/plugin
          chmod 600 ~/.ssh/plugin
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/plugin -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone git@github.com:lucapf/omarchy-tally.git plugin
          cd plugin
          git checkout -B main
          cp ../omarchy-widget/manifest.json ../omarchy-widget/Panel.qml ../omarchy-widget/README.md ../LICENSE .
          sed -i -E "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -q -m "Tally v$VERSION" -m "From lucapf/tally@$GITHUB_SHA"
          fi
          git tag -f "v$VERSION"
          git push origin main
          git push -f origin "v$VERSION"

  # The AUR package tally-calc-bin (aur/PKGBUILD) with the release's version and checksums. It needs
  # the secret AUR_SSH_KEY: the private half of an SSH key registered on the AUR account that owns
  # the package. Without it this job only says so.
  aur:
    needs: [version, release]
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      VERSION: ${{ needs.version.outputs.version }}
      AUR_KEY: ${{ secrets.AUR_SSH_KEY }}
    steps:
      - id: key
        run: |
          if [ -n "$AUR_KEY" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::AUR_SSH_KEY is not set: the AUR package tally-calc-bin is not updated"
          fi
      - name: Tools
        if: steps.key.outputs.ok == 'true'
        run: pacman -Syu --noconfirm --needed git openssh
      - uses: actions/checkout@v5
        if: steps.key.outputs.ok == 'true'
      - uses: actions/download-artifact@v4
        if: steps.key.outputs.ok == 'true'
        with:
          pattern: linux-*
          path: dist
          merge-multiple: true
      - name: Publish
        if: steps.key.outputs.ok == 'true'
        run: |
          sum() { cut -d' ' -f1 "dist/tally-$VERSION-$1-linux.tar.gz.sha256"; }
          # makepkg does not run as root.
          useradd -m builder
          mkdir -p /home/builder/.ssh
          printf '%s\n' "$AUR_KEY" > /home/builder/.ssh/aur
          chmod 600 /home/builder/.ssh/aur
          su builder -c "cd ~ && GIT_SSH_COMMAND='ssh -i ~/.ssh/aur -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new' git clone ssh://aur@aur.archlinux.org/tally-calc-bin.git aur"
          cp aur/PKGBUILD /home/builder/aur/
          cd /home/builder/aur
          sed -i -E \
            -e "s/^pkgver=.*/pkgver=$VERSION/" \
            -e "s/^pkgrel=.*/pkgrel=1/" \
            -e "s/^sha256sums_x86_64=.*/sha256sums_x86_64=('$(sum x86_64)')/" \
            -e "s/^sha256sums_aarch64=.*/sha256sums_aarch64=('$(sum aarch64)')/" \
            PKGBUILD
          chown -R builder /home/builder
          # Build it once (downloads the release, checks the checksum), then publish.
          su builder -c "cd ~/aur && makepkg -f --noconfirm && makepkg --printsrcinfo > .SRCINFO"
          cat > /home/builder/publish <<'SH'
          set -e
          cd ~/aur
          git checkout -B master
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "No change"
            exit 0
          fi
          git -c user.name='Luca Palanca Falsini' -c user.email='lucapf@gmail.com' commit -q -m "Update to $VERSION"
          GIT_SSH_COMMAND='ssh -i ~/.ssh/aur -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new' git push origin master
          SH
          su builder -c "VERSION=$VERSION bash /home/builder/publish"
