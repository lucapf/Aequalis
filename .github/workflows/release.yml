# Every push to master is a release: the version goes up, aequalis is built for Linux (x86_64 and
# aarch64), macOS (Apple Silicon) and Windows (x86_64: an installer, and a zip), and a GitHub release
# `v<version>` gets them.
#
# The version: the latest `v*` tag (none yet: Cargo.toml's) with the patch number up by one. A
# commit message starting with `minor` or `major` (any case: `minor: add …`, `Major …`) raises that
# number instead; with several commits in the push, the largest bump wins. Cargo.toml is not
# changed in the repository: the tags are the version, written into Cargo.toml for the build only.
name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

# One release at a time, in push order: each version is computed from the previous one's tag.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: v
        run: |
          # Already released (a re-run): the same version.
          done=$(git tag --points-at HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          if [ -n "$done" ]; then
            echo "version=${done#v}" >> "$GITHUB_OUTPUT"
            echo "HEAD is already $done"
            exit 0
          fi
          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          if [ -n "$last" ]; then
            base=${last#v}
            range="$last..HEAD"
          else
            base=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
            range=HEAD
          fi
          subjects=$(git log --format=%s "$range")
          bump=patch
          if printf '%s\n' "$subjects" | grep -qiE '^major([^[:alnum:]]|$)'; then
            bump=major
          elif printf '%s\n' "$subjects" | grep -qiE '^minor([^[:alnum:]]|$)'; then
            bump=minor
          fi
          IFS=. read -r major minor patch <<< "$base"
          case $bump in
            major) version="$((major + 1)).0.0" ;;
            minor) version="$major.$((minor + 1)).0" ;;
            patch) version="$major.$minor.$((patch + 1))" ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "${last:-Cargo.toml $base} → v$version ($bump)"

  # Ubuntu 22.04: the binaries need glibc 2.35 or newer, so they also run on newer Ubuntu, Debian,
  # Fedora and Arch Linux / Omarchy.
  linux:
    needs: version
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install stable --profile minimal && rustup default stable
      - name: Version
        run: |
          sed -i -E "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          sed -i -E "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" omarchy-widget/manifest.json
      - name: Test
        run: cargo test --release
      - name: Build
        run: |
          cargo build --release
          test "$(target/release/aequalis --version)" = "aequalis $VERSION"
          target/release/aequalis 10 km mi
      - name: Package
        run: |
          name=aequalis-$VERSION-${{ matrix.arch }}-linux
          mkdir -p "dist/$name"
          cp target/release/aequalis LICENSE README.md docs/Accepted_Syntax.md "dist/$name/"
          cp -r omarchy-widget "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*.tar.gz*

  # macOS on Apple Silicon (macOS 11 or newer).
  macos:
    needs: version
    runs-on: macos-14
    env:
      VERSION: ${{ needs.version.outputs.version }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Version
        run: sed -i '' -E "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
      - name: Test
        run: cargo test --release
      - name: Build
        run: |
          cargo build --release
          file target/release/aequalis
          test "$(target/release/aequalis --version)" = "aequalis $VERSION"
          target/release/aequalis 10 km mi
      - name: Package
        run: |
          name=aequalis-$VERSION-aarch64-macos
          mkdir -p "dist/$name"
          cp target/release/aequalis LICENSE README.md docs/Accepted_Syntax.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.tar.gz*

  # Windows 10 (1903) and 11, x86_64: the installer (Inno Setup: the tray app and the command line,

  # for the current user), checked by installing it, and the same programs in a zip.

  windows:

    needs: version

    runs-on: windows-latest

    env:

      VERSION: ${{ needs.version.outputs.version }}

    defaults:

      run:

        shell: bash

    steps:

      - uses: actions/checkout@v5

      - name: Toolchain

        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Version

        run: |

          sed -i -E "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml apps/windows/Cargo.toml

      - name: Zone database

        # For the tests only (TZDIR): the programs use the zones of the Windows registry.

        run: |

          python -m pip install --quiet tzdata

          echo "TZDIR=$(python -c 'import os, tzdata; print(os.path.join(os.path.dirname(tzdata.__file__), "zoneinfo"))')" >> "$GITHUB_ENV"

      - name: Test

        run: cargo test --release --workspace

      - name: Build

        run: |

          cargo build --release --workspace

          test "$(target/release/aequalis --version)" = "aequalis $VERSION"

          env -u TZDIR target/release/aequalis 10 km mi

      - name: Installer

        shell: pwsh

        run: |

          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'

          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }

          & $iscc /Q "/DVersion=$env:VERSION" installer/windows/aequalis.iss

          if ($LASTEXITCODE) { exit $LASTEXITCODE }

          & installer/windows/test-install.ps1 -Setup "dist/aequalis-$env:VERSION-x86_64-windows-setup.exe"

      - name: Package

        run: |

          name=aequalis-$VERSION-x86_64-windows

          mkdir -p "dist/$name"

          cp target/release/aequalis.exe target/release/aequalis-tray.exe LICENSE README.md docs/Accepted_Syntax.md "dist/$name/"

          (cd dist && 7z a -bso0 "$name.zip" "$name" && rm -r "$name")

          (cd dist && for f in *.exe *.zip; do sha256sum "$f" > "$f.sha256"; done)

          ls -l dist

      - uses: actions/upload-artifact@v4

        with:

          name: windows

          path: |

            dist/*.exe

            dist/*.zip

            dist/*.sha256



  # The release `v<version>` on the pushed commit (the tag is created with it), with every archive.
  release:
    needs: [version, linux, macos, windows]
    runs-on: ubuntu-latest
    env:
      TAG: v${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Aequalis $TAG" --generate-notes
          fi
